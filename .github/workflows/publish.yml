name: Publish site

# Runs every time something is added or changed, records the Horizon voice
# for any new article, then publishes the website.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache the Horizon voice model
        uses: actions/cache@v4
        with:
          path: /tmp/kokoro
          key: kokoro-v1.0-int8

      - name: Install voice tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng > /dev/null
          pip install -q kokoro-onnx soundfile
          mkdir -p /tmp/kokoro
          cd /tmp/kokoro
          [ -f voices-v1.0.bin ] || curl -sSL -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          [
